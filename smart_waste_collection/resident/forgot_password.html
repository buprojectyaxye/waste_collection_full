<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Resident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-3 p-4">
                    <div class="card-body">
                        <h2 class="text-center mb-2 text-success fw-bold">Reset Password</h2>
                        <p class="text-center text-muted mb-4 small">Enter your email address and we'll generate a temporary password for you.</p>
                        
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <form id="forgotPasswordForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-dark">Email address</label>
                                <input type="email" class="form-control bg-light border-0" id="email" required placeholder="Enter your email">
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Reset Password</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-decoration-none text-success small fw-semibold"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('alertBox');
            
            btn.disabled = true;
            btn.innerHTML = 'Resetting...';
            alertBox.classList.add('d-none');
            
            try {
                const res = await apiCall('/auth.php?action=reset_password', 'POST', { email });
                if(res.status === 'success') {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = res.message; // Will show "Your password has been reset to: password123"
                    document.getElementById('email').value = '';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>
</html>
